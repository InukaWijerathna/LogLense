[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loglense"
version = "0.5.0"
description = "A smart CLI log parser, filter, and watcher for developers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["log", "parser", "cli", "filter", "tail", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Environment :: Console",
    "Topic :: System :: Logging",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.4.0"]

[project.scripts]
loglense = "loglense.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loglense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 132
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]
